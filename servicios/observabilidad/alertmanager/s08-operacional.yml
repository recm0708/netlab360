# Destino interno autenticado; ninguna integración de mensajería externa.
route:
  receiver: netlab360-local
  group_by: [phase, alertname]
  group_wait: 1s
  group_interval: 5s
  repeat_interval: 1h

receivers:
  - name: netlab360-local
    webhook_configs:
      - url: http://127.0.0.1:9193/receive
        send_resolved: true
        http_config:
          basic_auth:
            username: webhook
            password_file: /usr/local/libexec/netlab360/s08-alertas/webhook.secret
