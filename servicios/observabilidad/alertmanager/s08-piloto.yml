# NETLAB360: piloto aislado sin correo, mensajería ni receptores externos.
route:
  receiver: piloto-local
  group_by: [alertname, laboratory]
  group_wait: 1s
  group_interval: 5s
  repeat_interval: 1h
receivers:
  - name: piloto-local
    webhook_configs:
      - url: http://127.0.0.1:9193/receive
        send_resolved: true
