# NETLAB360 S04: instancia AISLADA de Prometheus (no modifica B3).
# Script de inicio renderiza ruta absoluta del archivo de reglas.
global:
  scrape_interval: 2s
  scrape_timeout: 1s
  evaluation_interval: 2s

rule_files:
  - rules/s04-alerts.yml

scrape_configs:
  - job_name: netlab360-s04-multisede
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:9110
        labels:
          context: s04
          laboratory: netlab360-lab
