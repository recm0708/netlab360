# Fuente única de series temporales del laboratorio.
apiVersion: 1
datasources:
  - name: NETLAB360 Prometheus
    uid: netlab360-prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9091
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 10s
      httpMethod: POST
      prometheusType: Prometheus
      prometheusVersion: 3.7.0
