# Instancia local especializada; los secretos se inyectan mediante systemd.
[paths]
data = /var/lib/netlab360/grafana/data
logs = /var/lib/netlab360/grafana/logs
plugins = /var/lib/netlab360/grafana/plugins
provisioning = /opt/netlab360/grafana-config/provisioning

[server]
http_addr = 127.0.0.1
http_port = 3000
domain = 127.0.0.1
root_url = http://127.0.0.1:3000/
enable_gzip = true

[security]
admin_user = netlab360-admin
admin_password = $__file{/run/credentials/netlab360-s08-grafana.service/admin-password}
secret_key = $__file{/run/credentials/netlab360-s08-grafana.service/secret-key}
disable_gravatar = true
cookie_samesite = strict
allow_embedding = false

[users]
allow_sign_up = false
allow_org_create = false
auto_assign_org_role = Viewer

[auth.anonymous]
enabled = false

[auth.basic]
enabled = true

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[plugins]
preinstall_disabled = true

[unified_alerting]
enabled = false

[log]
mode = console
level = info
