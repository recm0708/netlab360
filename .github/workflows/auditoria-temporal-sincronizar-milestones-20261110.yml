name: NETLAB360 - Reconciliar milestone contadores S03 S04 S05

on:
  push:
    branches: [main]
    paths: ['.github/workflows/auditoria-temporal-sincronizar-milestones-20261110.yml']

permissions:
  contents: read
  issues: write

jobs:
  reconciliar:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Restablecer asociacion de una issue por milestone y validar contadores
        shell: bash
        run: |
          set -Eeuo pipefail
          restaurar() {
            for par in '3 19' '4 20' '5 64'; do
              read -r m i <<< "$par"
              echo "{\"milestone\":$m}" | gh api --method PATCH "repos/$GH_REPO/issues/$i" --input - >/dev/null || true
            done
          }
          trap restaurar EXIT
          for triple in '3 19 closed' '4 20 closed' '5 64 open'; do
            read -r m i esperado <<< "$triple"
            echo "========== ANTES S0$m issue $i =========="
            gh api "repos/$GH_REPO/milestones/$m" --jq '"milestone state=" + .state + " closed=" + (.closed_issues|tostring) + " open=" + (.open_issues|tostring)'
            test "$(gh api "repos/$GH_REPO/issues/$i" --jq .milestone.number)" = "$m"
            test "$(gh api "repos/$GH_REPO/issues/$i" --jq .state)" = "$esperado"
            echo '{"milestone":null}' | gh api --method PATCH "repos/$GH_REPO/issues/$i" --input - >/dev/null
            test "$(gh api "repos/$GH_REPO/issues/$i" --jq '.milestone == null')" = true
            echo "{\"milestone\":$m}" | gh api --method PATCH "repos/$GH_REPO/issues/$i" --input - >/dev/null
            test "$(gh api "repos/$GH_REPO/issues/$i" --jq .milestone.number)" = "$m"
            test "$(gh api "repos/$GH_REPO/issues/$i" --jq .state)" = "$esperado"
            gh api "repos/$GH_REPO/milestones/$m" --jq '"DESPUES S0$m: state=" + .state + " closed=" + (.closed_issues|tostring) + " open=" + (.open_issues|tostring)'
            echo "REASIGNACION_S0$m=OK"
          done
          echo "VERIFICACION_DE_CONSISTENCIA"
          for n in 1 2 3 4 5 6 7 8; do
            gh api "repos/$GH_REPO/milestones/$n" --jq '"S0$n state=" + .state + " closed=" + (.closed_issues|tostring) + " open=" + (.open_issues|tostring)'
          done
