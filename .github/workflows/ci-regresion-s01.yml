# Regresión offline: valida sintaxis, IPAM y pruebas sin desplegar la topología.
# Se ejecuta también cuando cambian los documentos o la licencia.
name: NETLAB360 - CI regresion B1 B2 B3 IaC B4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'operacion/**'
      - 'requirements-cientifico.txt'
      - 'servicios/**'
      - 'inventario/**'
      - 'ansible/**'
      - 'iac/**'
      - 'tests/**'
      - '**/*.md'
      - 'CITATION.cff'
      - 'LICENSE'
      - '.github/workflows/ci-regresion-s01.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'operacion/**'
      - 'requirements-cientifico.txt'
      - 'servicios/**'
      - 'inventario/**'
      - 'ansible/**'
      - 'iac/**'
      - 'tests/**'
      - '**/*.md'
      - 'CITATION.cff'
      - 'LICENSE'
      - '.github/workflows/ci-regresion-s01.yml'

permissions:
  contents: read

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Dependencias minimas para IPAM
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Compilar sintaxis Python
        run: python -m compileall -q scripts servicios operacion tests

      - name: Validar IPAM declarativo
        run: python scripts/validacion/validar_ipam.py inventario/ipam/topologia-b1.yaml

      - name: Ejecutar regresiones offline
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Auditar comentarios y estructura editorial
        run: python scripts/validacion/auditar_estilo_repositorio.py

      - name: Validar sintaxis Bash
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do bash -n "$f"; done \
            < <(find scripts operacion -type f -name '*.sh' -print0)
          echo "CI_BASH_SINTAXIS=OK"

      - name: Delimitar alcance
        run: |
          echo "CI_OFFLINE_REGRESION=OK"
          echo "AVISO: sin Docker/FRRouting real, sin VMware, sin validacion de entregables APA u OVA."

  s08-api:
    # Validar el backend con el intérprete de referencia sin alterar el job mínimo.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v5

      - name: Configurar Python de referencia S08
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Instalar dependencias API segun inventario
        run: |
          python --version
          python -m pip install --disable-pip-version-check -c requirements-cientifico.txt fastapi uvicorn pydantic httpx plotly
          python -m pip check
          python -c "import fastapi, uvicorn, pydantic, httpx"

      - name: Validar contrato y rutas S08
        run: python -m unittest discover -s tests -p 'test_s08_*.py' -v
