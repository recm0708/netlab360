name: NETLAB360 - Catalogo de capturas

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'evidencias/capturas/**'
      - 'scripts/validacion/validar-capturas-unificadas.py'
      - 'tests/test_capturas_por_fase.py'
      - '.github/workflows/ci-evidencias.yml'
  push:
    branches: [main]
    paths:
      - 'evidencias/capturas/**'
      - 'scripts/validacion/validar-capturas-unificadas.py'
      - 'tests/test_capturas_por_fase.py'
      - '.github/workflows/ci-evidencias.yml'

permissions:
  contents: read

jobs:
  catalogo-png:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Obtener proyecto
        uses: actions/checkout@v5
      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Revisar organización y formato de PNG
        run: python scripts/validacion/validar-capturas-unificadas.py
      - name: Ejecutar pruebas del catálogo
        run: python -m unittest discover -s tests -p 'test_capturas_por_fase.py' -v
