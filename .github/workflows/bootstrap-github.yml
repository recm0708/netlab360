name: NETLAB360 - Etiquetas e hitos
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-github.yml'
      - 'backlog/**'

permissions:
  contents: read
  issues: write

jobs:
  gestionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crear etiquetas, milestones y asociar las 37 issues
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for n in {1..8}; do
            printf -v w '%02d' "$n"
            gh label create "semana:$w" -R "$REPO" --color 0052CC --description "Fase semanal $w" --force >/dev/null
            if ! gh api "repos/$REPO/milestones?state=all&per_page=100" --jq '.[].title' | grep -Fxq "S$w"; then
              gh api -X POST "repos/$REPO/milestones" -f title="S$w" -f description="Cierre NETLAB360 S$w" >/dev/null
            fi
          done
          for spec in 'tipo:infra|0E8A16' 'tipo:dashboard|1D76DB' 'tipo:telemetria|5319E7' 'tipo:automatizacion|006B75' 'tipo:ia|B60205' 'tipo:docs|C2E0C6' 'tipo:seguridad|D93F0B' 'prioridad:alta|B60205' 'prioridad:media|FBCA04' 'estado:bloqueado|000000'; do
            IFS='|' read -r name color <<< "$spec"
            gh label create "$name" -R "$REPO" --color "$color" --force >/dev/null
          done
          gh issue list -R "$REPO" --state all --limit 200 --json number,title --jq '.[] | "\(.number)\t\(.title)"' > /tmp/issues.tsv
          while IFS=$'\t' read -r number title; do
            code="$(printf '%s' "$title" | cut -d ']' -f1 | tr -d '[')"
            week=''; category='tipo:infra'; priority='prioridad:alta'
            case "$code" in
              S01|001|002|003|004|007|008|022|025|026|028) week=01 ;;
              S02|005|006|023|029) week=02 ;;
              S03|009|010|011) week=03 ;;
              S04|012|013|014) week=04 ;;
              S05|015|016|024) week=05 ;;
              S06|017|018) week=06 ;;
              S07) week=07 ;;
              S08) week=08 ;;
              019|020|021|027) week='' ;;
              *) continue ;;
            esac
            case "$code" in
              007) category='tipo:dashboard' ;;
              012|013|014) category='tipo:telemetria' ;;
              008|009|010|011|025) category='tipo:automatizacion' ;;
              017|018) category='tipo:ia' ;;
              019|020|021|027|028|029|001) category='tipo:docs' ;;
              014|024) category='tipo:seguridad' ;;
            esac
            case "$code" in 009|011|015|016|017|018) priority='prioridad:media';; esac
            gh issue edit "$number" -R "$REPO" --add-label "$category" --add-label "$priority" >/dev/null
            if [[ -n "$week" ]]; then
              gh issue edit "$number" -R "$REPO" --add-label "semana:$week" --milestone "S$week" >/dev/null
            fi
            echo "Issue #$number: fase ${week:-transversal}, $category"
          done < /tmp/issues.tsv
