name: NETLAB360 - S05 Topologia interactiva solo lectura

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'servicios/topologia-s05/**'
      - 'inventario/topologia-extensiones-s05.json'
      - 'inventario/ipam/topologia-s02.yaml'
      - 'tests/test_s05_topologia.py'
      - '.github/workflows/ci-s05-topologia.yml'
  pull_request:
    paths:
      - 'servicios/topologia-s05/**'
      - 'inventario/topologia-extensiones-s05.json'
      - 'inventario/ipam/topologia-s02.yaml'
      - 'tests/test_s05_topologia.py'
      - '.github/workflows/ci-s05-topologia.yml'

permissions:
  contents: read

jobs:
  contrato-grafo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Instalar lectura de inventario
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Sintaxis y pruebas offline, sin infraestructura
        run: |
          python -m py_compile servicios/topologia-s05/app.py tests/test_s05_topologia.py
          python -m unittest discover -s tests -p 'test_s05_topologia.py' -v
      - name: Validar HTML y JSON de ampliaciones
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('inventario/topologia-extensiones-s05.json')
          e = json.loads(p.read_text(encoding='utf8'))
          assert e['schema_version'] == 1
          assert e['nodes'] == [] and e['links'] == []
          html = Path('servicios/topologia-s05/index.html').read_text(encoding='utf8')
          for name in ('/api/v1/graph', 'HQ', 'S1', 'S2', 'UNKNOWN'):
              assert name in html, name
          print('S05_CI_DIAGRAMA=VALIDADO_CON_CONTRATO_OFFLINE')
          PY
