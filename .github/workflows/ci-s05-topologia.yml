name: NETLAB360 - S05 Topologia interactiva solo lectura

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'servicios/topologia-s05/**'
      - 'inventario/topologia-extensiones-s05.json'
      - 'inventario/ipam/topologia-s02.yaml'
      - 'tests/test_s05_topologia.py'
      - 'tests/test_s05_layout.py'
      - 'tests/test_s05_observador_failover.py'
      - 'tests/test_s05_ha_precheck.py'
      - 'tests/test_s05_ha_red.py'
      - 'tests/test_s05_servicios_persistentes.py'
      - 'tests/test_s05_ha_http.py'
      - 'tests/test_s05_ha_monitor.py'
      - 'tests/test_s05_ha_noc_ciclo.py'
      - 'tests/test_s05_ha_ui.py'
      - 'servicios/ha-s05/**'
      - 'scripts/operacion/s05-observador-privilegiado.py'
      - 'servicios/systemd/**'
      - 'scripts/validacion/s05-observar-conmutacion-noc.py'
      - 'scripts/validacion/s05-ha-precheck.py'
      - 'scripts/validacion/s05-ha-http-precheck.py'
      - 'scripts/laboratorio/s05-ha-red-servicios.py'
      - 'scripts/laboratorio/s05-ha-http-failover.py'
      - 'scripts/validacion/s05-ha-noc-ciclo.py'
      - 'scripts/laboratorio/s02-failover-wan.py'
      - '.github/workflows/ci-s05-topologia.yml'
  pull_request:
    paths:
      - 'servicios/topologia-s05/**'
      - 'inventario/topologia-extensiones-s05.json'
      - 'inventario/ipam/topologia-s02.yaml'
      - 'tests/test_s05_topologia.py'
      - 'tests/test_s05_layout.py'
      - 'tests/test_s05_observador_failover.py'
      - 'tests/test_s05_ha_precheck.py'
      - 'tests/test_s05_ha_red.py'
      - 'tests/test_s05_servicios_persistentes.py'
      - 'tests/test_s05_ha_http.py'
      - 'tests/test_s05_ha_monitor.py'
      - 'tests/test_s05_ha_noc_ciclo.py'
      - 'tests/test_s05_ha_ui.py'
      - 'servicios/ha-s05/**'
      - 'scripts/operacion/s05-observador-privilegiado.py'
      - 'servicios/systemd/**'
      - 'scripts/validacion/s05-observar-conmutacion-noc.py'
      - 'scripts/validacion/s05-ha-precheck.py'
      - 'scripts/validacion/s05-ha-http-precheck.py'
      - 'scripts/laboratorio/s05-ha-red-servicios.py'
      - 'scripts/laboratorio/s05-ha-http-failover.py'
      - 'scripts/validacion/s05-ha-noc-ciclo.py'
      - 'scripts/laboratorio/s02-failover-wan.py'
      - '.github/workflows/ci-s05-topologia.yml'

permissions:
  contents: read

jobs:
  contrato-grafo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Instalar lectura de inventario
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Sintaxis y pruebas offline, sin infraestructura
        run: |
          python -m py_compile servicios/topologia-s05/app.py tests/test_s05_topologia.py
          python -m unittest discover -s tests -p 'test_s05_topologia.py' -v
          python -m unittest discover -s tests -p 'test_s05_layout.py' -v
          python -m unittest discover -s tests -p 'test_s05_observador_failover.py' -v
          python -m unittest discover -s tests -p 'test_s05_ha_precheck.py' -v
          python -m unittest discover -s tests -p 'test_s05_ha_red.py' -v
          python -m unittest discover -s tests -p 'test_s05_servicios_persistentes.py' -v
          python -m unittest discover -s tests -p 'test_s05_ha_http.py' -v
          python -m unittest discover -s tests -p 'test_s05_ha_monitor.py' -v
          python -m unittest discover -s tests -p 'test_s05_ha_noc_ciclo.py' -v
          python -m unittest discover -s tests -p 'test_s05_ha_ui.py' -v
          python -m unittest discover -s tests -p 'test_s04_exporter_multisede.py' -v
          python -m py_compile scripts/validacion/s05-observar-conmutacion-noc.py scripts/laboratorio/s02-failover-wan.py scripts/validacion/s05-ha-precheck.py scripts/laboratorio/s05-ha-red-servicios.py scripts/operacion/s05-observador-privilegiado.py servicios/observabilidad/s04_exporter_multisede.py servicios/ha-s05/http_ha.py servicios/ha-s05/monitor_http_s2.py scripts/validacion/s05-ha-http-precheck.py scripts/laboratorio/s05-ha-http-failover.py scripts/validacion/s05-ha-noc-ciclo.py
      - name: Comprobar sintaxis JavaScript del visor
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('servicios/topologia-s05/index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script>([\s\S]*?)</script>',p)
          assert len(blocks)==1, 'Se espera un unico bloque de JS propio'
          Path('/tmp/netlab360-s05-visor.js').write_text(blocks[0],encoding='utf-8')
          PY
          node --check /tmp/netlab360-s05-visor.js
      - name: Validar HTML y JSON de ampliaciones
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('inventario/topologia-extensiones-s05.json')
          e = json.loads(p.read_text(encoding='utf8'))
          assert e['schema_version'] == 1
          assert len(e['nodes']) == 3 and len(e['links']) == 5
          assert {n['id'] for n in e['nodes']} == {'BACKEND_HQ','BACKEND_S1','FRONTAL_HQ'}
          assert all(n.get('realized') is True for n in e['nodes'])
          assert all(link.get('realized') is True for link in e['links'])
          html = Path('servicios/topologia-s05/index.html').read_text(encoding='utf8')
          for name in ('/api/v1/graph', 'HQ', 'S1', 'S2', 'SIN DATOS', 'route_selection'):
              assert name in html, name
          print('S05_CI_DIAGRAMA=VALIDADO_CON_CONTRATO_OFFLINE')
          PY
