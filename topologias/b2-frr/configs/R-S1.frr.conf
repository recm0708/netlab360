! NETLAB360 R-S1 - propuesta B2-L3 (NO EJECUTADA)
! Las IP se asignarán a interfaces aisladas durante el despliegue.
frr version 10.7.1
frr defaults traditional
hostname R-S1
log stdout
service integrated-vtysh-config
!
interface wan-p
 description WAN primaria S1-HQ (10.78.0.2/30)
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface wan-b
 description WAN respaldo S1-HQ (10.78.0.6/30)
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 100
!
interface lo
 ip ospf area 0
!
interface lan0
 description LAN S1 10.71.10.0/24 (dummy aislada)
 ip ospf area 0
!
router ospf
 ospf router-id 10.79.0.2
 passive-interface default
 no passive-interface wan-p
 no passive-interface wan-b
!
line vty
!
