! NETLAB360 R-HQ - propuesta B2-L3 (NO EJECUTADA)
! Las IP se asignarán a interfaces aisladas durante el despliegue.
frr version 10.7.1
frr defaults traditional
hostname R-HQ
log stdout
service integrated-vtysh-config
!
interface wan-p
 description WAN primaria HQ-S1 (10.78.0.1/30)
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface wan-b
 description WAN respaldo HQ-S1 (10.78.0.5/30)
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 100
!
interface lo
 ip ospf area 0
!
interface lan0
 description LAN HQ 10.70.10.0/24 (dummy aislada)
 ip ospf area 0
!
router ospf
 ospf router-id 10.79.0.1
 passive-interface default
 no passive-interface wan-p
 no passive-interface wan-b
!
line vty
!
