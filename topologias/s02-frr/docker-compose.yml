# NETLAB360 S02 WAN — infraestructura declarativa, SIN networking de host.
# Cada router se despliega con network_mode: none. Enlaces veth WAN se agregaran
# solo mediante operaciones revisadas y con rollback. No modifica ens33.
name: netlab360-s02-wan
x-router: &router
  image: quay.io/frrouting/frr:10.7.1
  network_mode: none
  cap_drop: [ALL]
  cap_add: [NET_ADMIN, NET_RAW, NET_BIND_SERVICE, SETPCAP, SYS_ADMIN, SETUID, SETGID, CHOWN, DAC_READ_SEARCH, DAC_OVERRIDE]
  pids_limit: 128
  mem_limit: 512m
  tmpfs:
    - /run/frr:rw,nosuid,nodev,size=16m,uid=0,gid=101,mode=0770
    - /var/tmp/frr:rw,nosuid,nodev,size=16m,uid=100,gid=101,mode=0770
  restart: "no"
services:
  r-hq:
    <<: *router
    container_name: nl360-s02-r-hq
    hostname: R-HQ
    volumes:
      - type: bind
        source: "${HOME}/netlab360-bootstrap/s02/runtime/R-HQ"
        target: /etc/frr
  r-s1:
    <<: *router
    container_name: nl360-s02-r-s1
    hostname: R-S1
    volumes:
      - type: bind
        source: "${HOME}/netlab360-bootstrap/s02/runtime/R-S1"
        target: /etc/frr
  r-s2:
    <<: *router
    container_name: nl360-s02-r-s2
    hostname: R-S2
    volumes:
      - type: bind
        source: "${HOME}/netlab360-bootstrap/s02/runtime/R-S2"
        target: /etc/frr
